<svg xmlns="http://www.w3.org/2000/svg" width="440" height="76" viewBox="0 0 440 76" role="img" aria-label="View my portfolio: sayrz1.github.io">
  <title>View my portfolio: sayrz1.github.io</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="0.55" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill"><rect x="4" y="4" width="432" height="68" rx="34"/></clipPath>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <style>
    .t { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #fff; }
    .big { font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
    .small { font-size: 13px; font-weight: 500; fill: #ffedd5; }
    .sweep { animation: sweep 3.2s ease-in-out infinite; }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    .ring { animation: pulse 2.4s ease-in-out infinite; transform-origin: 220px 38px; }
    @keyframes sweep { 0% { transform: translateX(-200px); } 60%, 100% { transform: translateX(520px); } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.8; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .arrow, .ring { animation: none; } .sweep { opacity: 0; } }
  </style>
  <rect class="ring" x="4" y="4" width="432" height="68" rx="34" fill="none" stroke="#fb923c" stroke-width="4" filter="url(#glow)"/>
  <g clip-path="url(#pill)">
    <rect x="4" y="4" width="432" height="68" fill="url(#bg)"/>
    <g class="sweep"><rect x="0" y="0" width="120" height="76" fill="url(#shine)" transform="skewX(-20)"/></g>
  </g>
  <rect x="4.5" y="4.5" width="431" height="67" rx="33.5" fill="none" stroke="#fff" stroke-opacity="0.25"/>
  <!-- globe icon -->
  <g transform="translate(34 22)" fill="none" stroke="#fff" stroke-width="2">
    <circle cx="16" cy="16" r="14"/>
    <ellipse cx="16" cy="16" rx="6" ry="14"/>
    <path d="M2 16h28M5 8h22M5 24h22"/>
  </g>
  <text class="t big" x="84" y="36">View my portfolio</text>
  <text class="t small" x="84" y="56">sayrz1.github.io · live demos of everything I build</text>
  <g transform="translate(392 26)"><g class="arrow" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 12h20M12 4l8 8-8 8"/>
  </g></g>
</svg>
